[project]
name = "document-intelligence"
version = "0.1.0"
description = "Turn scanned receipts and invoices into validated, structured JSON with vision LLMs, with measured field-level accuracy"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=docintel --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["docintel"]
